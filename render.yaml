services:
  - type: web
    name: khan-interface-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: OWNER_NAME
        value: Nawaz Khan
      - key: BUSINESS_NAME
        value: KM Car Deals
      # Add these in Render dashboard (keep secret):
      # SUPABASE_URL
      # SUPABASE_ANON_KEY
      # SUPABASE_SERVICE_ROLE_KEY
      # GROQ_API_KEY
      # TWILIO_ACCOUNT_SID
      # TWILIO_AUTH_TOKEN
      # TWILIO_WHATSAPP_FROM
      # JWT_SECRET
      # FRONTEND_URL
